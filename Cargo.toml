[package]
name = "dwarfclone"
version = "0.2.2"
edition = "2021"
description = "A Dwarf Fortress-style colony simulator for the terminal"

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
ratatui = { version = "0.26", features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
